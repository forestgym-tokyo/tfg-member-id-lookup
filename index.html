<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>会員番号お問い合わせ</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background:
        linear-gradient(rgba(0,0,0,0.78), rgba(0,0,0,0.9)),
        url("gym-bg.jpg");
      background-size: cover;
      background-position: center;
      color: #fff;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .card {
      background: rgba(10, 10, 10, 0.88);
      border: 1px solid rgba(141,255,0,0.28);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
    }

    .logo {
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: #8dff00;
      margin-bottom: 10px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 10px;
      text-align: center;
      color: #fff;
    }

    .en-title {
      text-align: center;
      font-size: 12px;
      color: #8dff00;
      letter-spacing: 0.12em;
      margin-bottom: 22px;
    }

    .lead {
      font-size: 14px;
      line-height: 1.8;
      color: #ddd;
      margin-bottom: 26px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ccc;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.96);
      color: #111;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #8dff00;
      box-shadow: 0 0 0 3px rgba(141,255,0,0.22);
    }

    button {
      width: 100%;
      padding: 17px;
      border-radius: 999px;
      border: none;
      background: #00c853;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      display: none;
      white-space: pre-line;
    }

    .success {
      display: block;
      background: rgba(141,255,0,0.12);
      color: #baff55;
      border: 1px solid rgba(141,255,0,0.38);
    }

    .error {
      display: block;
      background: rgba(255,70,70,0.12);
      color: #ff9b9b;
      border: 1px solid rgba(255,70,70,0.38);
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.7;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #777;
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">The Forest Gym</div>

      <h1>会員番号お問い合わせ</h1>
      <div class="en-title">MEMBER NUMBER INQUIRY</div>

      <div class="lead">
        ご登録メールアドレスを入力してください。<br>
        会員番号をメールでお送りします。
      </div>

      <label for="email">メールアドレス / Email Address</label>
      <input id="email" type="email" placeholder="example@email.com" autocomplete="email">

      <button id="submitBtn" type="button" onclick="submitForm()">送信する</button>

      <div id="message" class="message" aria-live="polite"></div>

      <div class="note">
        ※登録メールアドレスとは、決済連絡等を受信しているメールアドレスです。<br>
        ※未登録のメールアドレスには会員番号は送信されません。<br>
        ※会員番号は画面には表示されません。
      </div>
    </div>

    <div class="footer">The Forest Gym</div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxuC-MipmiaYvMuid0pH6hT_kgO0ZTW4XB-xZ4LbY65lDm6pfTnLTPLAF4SC-UYYAa4/exec";
    const REQUEST_TIMEOUT_MS = 15000;

    const emailInput = document.getElementById("email");
    emailInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        submitForm();
      }
    });

    function setLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      btn.disabled = isLoading;
      btn.textContent = isLoading ? "送信中..." : "送信する";
    }

    function showMessage(text, ok) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = "message " + (ok ? "success" : "error");
    }

    function normalizeResult(res) {
      if (!res || typeof res !== "object") {
        throw new Error("Invalid response");
      }
      return {
        ok: Boolean(res.ok),
        message: res.message || (res.ok ? "送信しました。メールをご確認ください。" : "処理に失敗しました。")
      };
    }

    async function requestWithFetch(email) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      const url = new URL(GAS_API_URL);
      url.searchParams.set("action", "sendMemberNo");
      url.searchParams.set("email", email);
      url.searchParams.set("t", Date.now().toString());

      try {
        const response = await fetch(url.toString(), {
          method: "GET",
          redirect: "follow",
          cache: "no-store",
          signal: controller.signal
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const text = await response.text();
        return normalizeResult(JSON.parse(text));
      } finally {
        clearTimeout(timer);
      }
    }

    function requestWithJsonp(email) {
      return new Promise((resolve, reject) => {
        const callbackName = "memberNoCallback_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        let finished = false;

        const cleanup = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          delete window[callbackName];
          script.remove();
        };

        window[callbackName] = function(res) {
          try {
            const result = normalizeResult(res);
            cleanup();
            resolve(result);
          } catch (error) {
            cleanup();
            reject(error);
          }
        };

        const url = new URL(GAS_API_URL);
        url.searchParams.set("action", "sendMemberNo");
        url.searchParams.set("email", email);
        url.searchParams.set("callback", callbackName);
        url.searchParams.set("t", Date.now().toString());

        script.src = url.toString();
        script.async = true;
        script.onerror = function() {
          cleanup();
          reject(new Error("JSONP request failed"));
        };

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("JSONP request timed out"));
        }, REQUEST_TIMEOUT_MS);

        document.body.appendChild(script);
      });
    }

    async function submitForm() {
      const email = emailInput.value.trim();
      const msg = document.getElementById("message");
      msg.className = "message";
      msg.textContent = "";

      if (!email) {
        showMessage("メールアドレスを入力してください。", false);
        return;
      }

      if (!emailInput.checkValidity()) {
        showMessage("メールアドレスの形式をご確認ください。", false);
        return;
      }

      setLoading(true);

      try {
        let result;
        try {
          result = await requestWithFetch(email);
        } catch (fetchError) {
          result = await requestWithJsonp(email);
        }

        showMessage(result.message, result.ok);
        if (result.ok) emailInput.value = "";
      } catch (error) {
        console.error("Member number inquiry failed:", error);
        showMessage("通信エラーが発生しました。時間をおいて再度お試しください。", false);
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
